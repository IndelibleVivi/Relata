name: Offline research checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Public repository checks
        run: python3 -B tools/check_repo.py
      - name: Standard-library regression tests
        run: python3 -B -m unittest discover -s tests -v
      - name: Offline end-to-end rehearsal and evidence verification
        run: |
          python3 -B tools/synthetic_pilot.py run --output "$RUNNER_TEMP/relata-rc002"
          python3 -B tools/synthetic_pilot.py verify "$RUNNER_TEMP/relata-rc002"
